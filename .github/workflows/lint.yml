---
name: Shared lint

on:
  pull_request:
  push:
    branches:
      - main

permissions:
  contents: read

jobs:
  lint:
    uses: DevSecNinja/.github/.github/workflows/lint.yml@eadb4f166f27d0864147189741c7596560be39dd # v3.6.0
    permissions:
      contents: read
      security-events: write # Upload shared linter SARIF to code scanning.
    with:
      # renovate: datasource=github-releases depName=jdx/mise
      mise-version: "2026.8.0"
      lint-fail-on-error: true
      lint-go: false
      lint-config-drift: false
