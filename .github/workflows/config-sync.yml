---
name: Config Sync

on:
  schedule:
    - cron: "0 0 * * 1"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  sync:
    uses: DevSecNinja/.github/.github/workflows/config-sync.yml@0d0f448de257f354c89dc3a128871235d6ba8c11 # v2.5.0
    permissions:
      contents: write # Commit the synchronized configuration branch.
      issues: write # Ensure the config-sync label exists.
      pull-requests: write # Open or update the synchronization PR.
    with:
      sync-templates: false
