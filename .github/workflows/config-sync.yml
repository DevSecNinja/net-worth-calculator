---
name: Config Sync

on:
  schedule:
    - cron: "0 0 * * 1"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  sync:
    uses: DevSecNinja/.github/.github/workflows/config-sync.yml@e28a49a14d4530962b165e0d35a8a331b2b42f23 # v3.7.1
    permissions:
      contents: write # Commit the synchronized configuration branch.
      pull-requests: write # Open or update the synchronization PR.
    with:
      sync-templates: false
    secrets:
      AUTOMATION_APP_PRIVATE_KEY: ${{ secrets.AUTOMATION_APP_PRIVATE_KEY }}
