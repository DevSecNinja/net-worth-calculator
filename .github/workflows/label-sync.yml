---
name: Label Sync

on:
  workflow_dispatch:
  push:
    branches:
      - main
    paths:
      - .github/labels.yaml
      - .github/labels-base.yaml
  schedule:
    - cron: "0 0 * * *"

permissions:
  contents: read

jobs:
  label-sync:
    uses: DevSecNinja/.github/.github/workflows/label-sync.yml@eadb4f166f27d0864147189741c7596560be39dd # v3.6.0
    permissions:
      contents: read
      issues: write # Create, update, and remove repository labels.
    with:
      base-labels-file: .github/labels-base.yaml
      labels-file: .github/labels.yaml
      delete-other-labels: true
