---
name: Labeler

on:
  workflow_dispatch:
  pull_request:
    branches:
      - main
  issues:
    types:
      - opened
      - edited

permissions:
  contents: read

jobs:
  labeler:
    uses: DevSecNinja/.github/.github/workflows/labeler.yml@eadb4f166f27d0864147189741c7596560be39dd # v3.6.0
    permissions:
      contents: read
      issues: write # Apply labels to newly opened or edited issues.
      pull-requests: write # Apply labels to same-repository PRs.
    with:
      config-path: pr-labeler.yaml
      issue-config-path: issue-labeler.yaml
