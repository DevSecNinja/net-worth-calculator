---
name: Release Please

on:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: release-please
  cancel-in-progress: false

jobs:
  release-please:
    uses: DevSecNinja/.github/.github/workflows/release-please.yml@e28a49a14d4530962b165e0d35a8a331b2b42f23 # v3.7.1
    permissions:
      contents: write # Push the release branch, create the version tag, and publish the GitHub Release.
      pull-requests: write # Open or update the conventional release PR.
    with:
      target-branch: main
    secrets:
      AUTOMATION_APP_PRIVATE_KEY: ${{ secrets.AUTOMATION_APP_PRIVATE_KEY }}
